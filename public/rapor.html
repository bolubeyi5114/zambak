<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gelişim Raporu · Zambak Danışmanlık</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--krem:#f6f1e1;--krem-koyu:#ece4c9;--ada:#a1af83;--ada-acik:#dfe5d1;--yesil:#2f4a22;--yesil-orta:#4c6b3a;--metin:#2a2f25;--soluk:#6b7064}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e4d2;font-family:"Source Sans 3",system-ui,sans-serif;color:var(--metin);font-size:14px;line-height:1.5}
  .arac{max-width:820px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .arac .kutu{background:#fffdf7;border-radius:14px;padding:14px 16px}
  .arac label{display:block;font-weight:600;font-size:.92rem;margin:8px 0 4px}
  .arac select,.arac textarea{width:100%;padding:10px;border:1.5px solid var(--krem-koyu);border-radius:10px;font:inherit;background:#fff}
  .arac textarea{min-height:90px}
  .onay{display:flex;gap:8px;align-items:flex-start;font-weight:400 !important}
  .btn{border:0;border-radius:12px;background:var(--yesil);color:#fff;font:inherit;font-weight:700;padding:13px 18px;width:100%;cursor:pointer;font-size:1rem}
  .not{color:var(--soluk);font-size:.85rem;margin:6px 0 0}
  .sayfa{background:#fff;max-width:820px;margin:0 auto 30px;padding:42px 46px;box-shadow:0 4px 24px rgba(47,74,34,.12)}
  .ust{display:flex;align-items:center;gap:18px;border-bottom:3px solid var(--ada);padding-bottom:16px;margin-bottom:18px}
  .ust img{width:84px;height:84px}
  .ust h1{font-family:"Cormorant Garamond",Georgia,serif;color:var(--yesil);font-size:30px;margin:0;line-height:1.1}
  .ust p{margin:2px 0 0;color:var(--soluk)}
  .ust .tarih{margin-left:auto;text-align:right;color:var(--soluk);font-size:.9rem}
  h2{font-family:"Cormorant Garamond",Georgia,serif;color:var(--yesil);font-size:21px;margin:22px 0 8px;border-bottom:1px solid var(--krem-koyu);padding-bottom:4px}
  table.bilgi{width:100%;border-collapse:collapse}
  table.bilgi td{padding:5px 8px;border-bottom:1px solid #f0ead6;vertical-align:top}
  table.bilgi td:first-child{color:var(--soluk);width:34%}
  .kutular{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0}
  .kutular div{background:var(--krem);border-radius:10px;padding:10px 12px}
  .kutular span{display:block;font-size:.8rem;color:var(--soluk)}
  .kutular strong{font-size:1.5rem;color:var(--yesil)}
  .grafik svg{width:100%;height:auto}
  .takip{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;align-items:center;border-bottom:1px solid #f0ead6;padding:8px 0}
  .takip p{margin:2px 0}
  .ozet{border-left:4px solid var(--ada);padding:4px 0 4px 12px;margin:10px 0;page-break-inside:avoid}
  .ozet b{color:var(--yesil)}
  .ozet p{margin:3px 0;white-space:pre-wrap}
  .ozet .gizli-not{color:var(--soluk);font-size:.9rem}
  ul.odev{padding-left:18px;margin:6px 0}
  ul.odev li{margin:3px 0}
  .etiket{font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--krem-koyu);margin-left:6px}
  .etiket.yapildi{background:var(--ada-acik);color:var(--yesil)}
  .degerlendirme{white-space:pre-wrap;background:var(--krem);border-radius:10px;padding:12px 14px}
  .imza{display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;gap:20px}
  .imza .cizgi{border-top:1px solid var(--metin);width:200px;text-align:center;padding-top:4px;font-size:.9rem}
  .alt{margin-top:26px;border-top:1px solid var(--krem-koyu);padding-top:8px;font-size:.8rem;color:var(--soluk);text-align:center}
  .yukleniyor{text-align:center;padding:40px;color:var(--soluk)}
  @media (max-width:640px){.sayfa{padding:24px 18px}.kutular{grid-template-columns:repeat(2,1fr)}.takip{grid-template-columns:1fr}.ust img{width:60px;height:60px}.ust h1{font-size:24px}}
  @page{size:A4;margin:14mm}
  @media print{body{background:#fff}.arac{display:none}.sayfa{box-shadow:none;margin:0;padding:0;max-width:none}.kutular{grid-template-columns:repeat(4,1fr)}.takip{grid-template-columns:1fr 1.4fr}h2{page-break-after:avoid}}
</style>
</head>
<body>
<div class="arac" id="arac">
  <div class="kutu">
    <label for="donem">Rapor dönemi</label>
    <select id="donem"><option value="0">Başlangıçtan bugüne</option><option value="90">Son 3 ay</option><option value="30">Son 1 ay</option></select>
    <label class="onay"><input type="checkbox" id="notlar"> Görüşme notlarını ve gözlemleri de ekle (yalnızca kurum içi kullanım için, veliye verilecek raporda işaretlemeyin)</label>
    <label for="degerlendirme">Uzman değerlendirmesi <small>(rapora eklenir)</small></label>
    <textarea id="degerlendirme" placeholder="Dönemin genel değerlendirmesi ve önerileriniz…"></textarea>
  </div>
  <button class="btn" id="yazdir">PDF olarak kaydet / Yazdır</button>
  <p class="not">Telefonda: açılan ekranda yazıcı olarak “PDF olarak kaydet”i seçin, sonra WhatsApp'tan veliye gönderebilirsiniz.</p>
</div>
<div class="sayfa" id="sayfa"><div class="yukleniyor">Rapor hazırlanıyor…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/rapor.js"></script>
</body>
</html>
